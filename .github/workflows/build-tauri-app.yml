name: Build Tauri App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            artifact_name: yingdraft-companion-windows-x64
          # 仅发 Windows + macOS Intel：Apple Silicon 用户通过 Rosetta 运行，
          # 规避未签名 arm64 二进制被系统拒绝执行的问题。
          # Linux 桌面用户极少，不再打包以缩短构建时间（如有需要可后续单独提供）。
          - runner: macos-15-intel
            artifact_name: yingdraft-companion-macos-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: tauri-${{ matrix.artifact_name }}
          workspaces: |
            . -> target

      - name: Fetch bundled ffprobe
        shell: bash
        run: |
          # 把随包 ffprobe 下载到 app/src-tauri/binaries/，Tauri externalBin 需要它在构建期存在。
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            pwsh scripts/fetch-ffprobe.ps1
          else
            bash scripts/fetch-ffprobe.sh
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app
        working-directory: app
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            # WiX/MSI 对中文产品名兼容性不好，Windows 端只产出 NSIS 安装器。
            pnpm tauri build --bundles nsis
          else
            pnpm tauri build
          fi

      - name: Collect bundles
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact_name }}"
          bundle_root=""
          for candidate in \
            "target/release/bundle" \
            "app/src-tauri/target/release/bundle"
          do
            if [[ -d "$candidate" ]]; then
              bundle_root="$candidate"
              break
            fi
          done

          if [[ -z "$bundle_root" ]]; then
            echo "未找到 Tauri bundle 输出目录。" >&2
            echo "已检查:" >&2
            echo "  target/release/bundle" >&2
            echo "  app/src-tauri/target/release/bundle" >&2
            echo "当前 target/release 内容:" >&2
            find target/release -maxdepth 3 -type d -print 2>/dev/null || true
            exit 1
          fi
          echo "使用 Tauri bundle 输出目录: $bundle_root"

          find "$bundle_root" -type f \
            ! -name "*.dSYM" \
            ! -path "*/.DS_Store" \
            -exec cp {} "dist/${{ matrix.artifact_name }}/" \;

          file_count="$(find "dist/${{ matrix.artifact_name }}" -type f | wc -l | tr -d ' ')"
          if [[ "$file_count" -eq 0 ]]; then
            echo "Tauri 没有产出可上传的安装包。" >&2
            exit 1
          fi

          cd dist
          tar -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"

      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}
            dist/${{ matrix.artifact_name }}.tar.gz

  publish:
    name: Publish Tauri Release Assets
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          tag="$(echo "$tag" | xargs)"

          if [[ -z "$tag" ]]; then
            echo "发布标签为空，无法发布 Release。" >&2
            exit 1
          fi

          if [[ "$tag" != v* ]]; then
            echo "release_version 必须以 v 开头，例如 v0.1.0。" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-upload
          find release-assets -name "yingdraft-companion-*.tar.gz" -type f -exec cp {} release-upload/ \;
          ls -lh release-upload
          count="$(find release-upload -name "yingdraft-companion-*.tar.gz" -type f | wc -l | tr -d ' ')"
          if [[ "$count" -ne 2 ]]; then
            echo "预期 2 个桌面端发布包（Windows / macOS Intel），实际找到 $count 个。" >&2
            exit 1
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              --target "$GITHUB_SHA"
          gh release upload "$RELEASE_TAG" release-upload/*.tar.gz --clobber
